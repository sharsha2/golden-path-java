name: ci

# PRs are scanned but never push. Only main publishes.
on:
  push:
    branches: [main]
  pull_request:

# Default for every job: read-only. Jobs ask for more only if they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B verify

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Trivy - scan pom.xml dependencies
        # v0.36.0 published 2026-04-22, five weeks AFTER the 2026-03-19 trivy-action
        # tag-hijack incident (CVE-2026-33634). Pinned by SHA so a tag force-push
        # cannot change what runs here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'                 # fail the job if anything is found
          trivyignores: .trivyignore
          version: v0.76.1               # pin the Trivy binary too; update after checking releases

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                 # full history: secrets in OLD commits count too
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: zizmor - audit workflow files
        run: |
          pip install "zizmor==1.31.1"
          zizmor .                       # audits this repo's workflows; fails on findings

  oidc-lab:
    # Kept from Week 3. Deliberately NOT in image's needs: it is skipped on pull
    # requests, and a skipped dependency would skip the image scan too.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write                 # allows this job to request an OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: pip install "pyjwt[crypto]>=2.8,<3"
      - name: Get an OIDC token and verify it like a cloud provider would
        env:
          # The ONE repo + branch we trust.
          # This repo's OIDC subjects carry immutable numeric IDs (owner@ownerID/repo@repoID),
          # so the plain "repo:owner/name:ref:..." form would NOT match. The IDs survive a
          # rename and cannot be reclaimed by someone re-registering a deleted name.
          ALLOWED_SUBJECT: "repo:sharsha2@36820319/golden-path-java@1426315790:ref:refs/heads/main"
        run: |
          OIDC_TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=golden-path-lab" | jq -r .value)
          echo "::add-mask::$OIDC_TOKEN"     # never show the raw token in logs
          export OIDC_TOKEN
          python3 scripts/verify_oidc.py

  image:
    needs: [test, dependency-scan, secret-scan, workflow-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write                 # only this job can write to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build image
        run: docker build -t golden-path:ci .
      - name: Trivy - image gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: golden-path:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          version: v0.76.1
      # Everything below runs ONLY on main: PRs are scanned but never pushed
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # auto-created per job, expires when the job ends
          ACTOR: ${{ github.actor }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/golden-path:${GITHUB_SHA::12}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag golden-path:ci "$IMAGE"
          docker push "$IMAGE"
          echo "Pushed: $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")" >> "$GITHUB_STEP_SUMMARY"
