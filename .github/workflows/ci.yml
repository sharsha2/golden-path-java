name: ci

# PRs are scanned but never push. Only main publishes.
on:
  push:
    branches: [main]
  pull_request:

# Default for every job: read-only. Jobs ask for more only if they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B verify

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Trivy resolves parent POMs/BOMs to build the real dependency tree, and
      # checks ~/.m2 before the network. Warming the local repo first keeps it
      # off Maven Central, which rate-limits shared CI runners (HTTP 429).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B -q dependency:go-offline
      - name: Trivy - scan pom.xml dependencies
        # v0.36.0 published 2026-04-22, five weeks AFTER the 2026-03-19 trivy-action
        # tag-hijack incident (CVE-2026-33634). Pinned by SHA so a tag force-push
        # cannot change what runs here.
        # exit-code 0: the report below runs first, then the gate reads this file.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-fs.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore
          version: v0.76.1
      # Before the gate: a failing scan is when you most need to read the report.
      - name: Dependency report
        run: ./scripts/dep-report.sh trivy-fs.json >> "$GITHUB_STEP_SUMMARY"
      - name: Dependency gate
        run: |
          n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-fs.json)
          if [ "$n" -gt 0 ]; then
            echo "::error::$n fixable HIGH/CRITICAL dependency finding(s) — see the Dependency report on the run summary"
            exit 1
          fi
          echo "Gate passed: no fixable HIGH/CRITICAL dependency findings."
               # pin the Trivy binary too; update after checking releases

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                 # full history: secrets in OLD commits count too
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: zizmor - audit workflow files
        run: |
          pip install --require-hashes -r requirements/zizmor.txt
          zizmor .                       # audits this repo's workflows; fails on findings

  oidc-lab:
    # Kept from Week 3. Deliberately NOT in image's needs: it is skipped on pull
    # requests, and a skipped dependency would skip the image scan too.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write                 # allows this job to request an OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      # --require-hashes: pip installs exactly these bytes or fails. A compromised
      # PyPI account or a swapped artifact cannot change what runs here.
      - run: pip install --require-hashes -r requirements/oidc.txt
      - name: Get an OIDC token and verify it like a cloud provider would
        env:
          # The ONE repo + branch we trust.
          # This repo's OIDC subjects carry immutable numeric IDs (owner@ownerID/repo@repoID),
          # so the plain "repo:owner/name:ref:..." form would NOT match. The IDs survive a
          # rename and cannot be reclaimed by someone re-registering a deleted name.
          ALLOWED_SUBJECT: "repo:sharsha2@36820319/golden-path-java@1426315790:ref:refs/heads/main"
        run: |
          OIDC_TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=golden-path-lab" | jq -r .value)
          echo "::add-mask::$OIDC_TOKEN"     # never show the raw token in logs
          export OIDC_TOKEN
          python3 scripts/verify_oidc.py

  image:
    needs: [test, dependency-scan, secret-scan, workflow-scan]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write                 # only this job can write to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build image
        run: docker build -t golden-path:ci .
      # Scan to JSON with exit-code 0 so this step never fails. The report and the
      # gate below both read this one file, so the verdict can never disagree with
      # what the report shows, and the image is only scanned once.
      - name: Trivy - scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: golden-path:ci
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore
          version: v0.76.1
      # SBOM of the exact image that was just scanned, so the inventory and the
      # verdict always describe the same artifact.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: golden-path:ci
          format: cyclonedx
          output: sbom.cdx.json
          version: v0.76.1
      # Written BEFORE the gate on purpose: a failing build is exactly when you
      # need the report, so it must not be skipped by the failure.
      - name: Build report
        run: ./scripts/build-report.sh trivy.json sbom.cdx.json golden-path:ci >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cdx.json
            trivy.json
          retention-days: 30
      # THE GATE. Reads the scan above rather than re-scanning, and fails the job
      # if anything fixable was found. Everything after this is main-only.
      - name: Image gate
        run: |
          n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          if [ "$n" -gt 0 ]; then
            echo "::error::$n fixable HIGH/CRITICAL finding(s) — see the Build report on the run summary"
            exit 1
          fi
          echo "Gate passed: no fixable HIGH/CRITICAL findings."
      # Everything below runs ONLY on main: PRs are scanned but never pushed
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/$OWNER/golden-path"
          IMAGE="$REPO:${GITHUB_SHA::12}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag golden-path:ci "$IMAGE"
          docker push "$IMAGE"
          # Ask the REGISTRY for the digest. Do not read RepoDigests[0]: that list
          # holds an entry per local tag, and index 0 is not guaranteed to be the
          # one just pushed. It resolved to "golden-path@sha256:..." here, which
          # dropped the registry and sent cosign to Docker Hub.
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "image=$REPO"    >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed: \`$REPO@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"


  # Signing lives in its own job on purpose. The image job runs a Maven build
  # with third-party plugins and base images; this job runs only cosign. Per the
  # May 2026 TanStack attack, code sharing a job with an OIDC token can read that
  # token while it is valid — so the signing identity exists only in a small job
  # that does almost nothing. It never checks out the repo.
  sign:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write            # store the signature next to the image in GHCR
      id-token: write            # keyless signing: proves this workflow's identity to Sigstore
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      # v4.1.3 (not v4.1.4) and cosign v3.1.4 (not v3.1.6): both newer releases
      # are under the 7-day cooldown this repo applies to dependencies. Same rule,
      # applied by hand where Dependabot does not reach.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # Sign the DIGEST, never the tag: a tag can be moved to point at other
      # bytes, so a signature over a tag proves nothing about what you pull.
      - name: Sign the image by digest (keyless)
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # Verifying immediately is the point: an unverified signature is just a
      # blob. The two --certificate-* flags are the actual check — they assert
      # WHICH workflow on WHICH ref signed it, not merely that someone did.
      - name: Verify the signature we just made
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > /dev/null
          echo "Signed and verified: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      # Re-generate the SBOM from the PUSHED digest, not from the local
      # golden-path:ci tag the image job scanned. The attestation must describe
      # the artifact the client actually pulls, and only the digest proves that.
      - name: Generate SBOM from the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          version: v0.76.1
      # Signature  = "this digest came from my pipeline."
      # Attestation = that, PLUS a signed statement about it — here the SBOM.
      # The inventory becomes something a client can verify, not a file we email.
      - name: Attest the SBOM (signed, attached to the digest)
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
      - name: Verify the SBOM attestation
        run: |
          cosign verify-attestation "$IMAGE@$DIGEST" --type cyclonedx \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > /dev/null
          echo "SBOM attested: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
