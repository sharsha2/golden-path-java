version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7        # only propose versions that have been public for 7+ days

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
