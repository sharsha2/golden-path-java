apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: golden-path-config
    literals:
      - APP_GREETING=Hello from base
secretGenerator:
  - name: golden-path-secret
    literals:
      - DB_PASSWORD=not-a-real-password